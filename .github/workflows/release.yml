name: Release Assets

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  linux-amd64:
    name: Build and attach self-installing Linux amd64 binary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Validate release tag and crate version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' is not a supported semantic version (expected vX.Y.Z)."
            exit 1
          fi

          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "palworld-control-center") | .version')"
          if [[ "${RELEASE_TAG#v}" != "$crate_version" ]]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match Cargo.toml version '$crate_version'."
            exit 1
          fi

      - name: Test and build release binary
        run: |
          cargo test --all-features --locked
          cargo build --release --locked

      - name: Package self-installing binary and checksum
        run: |
          set -euo pipefail
          install -d dist
          install -m 0755 target/release/palworld-control-center dist/palworld-control-center-linux-amd64
          (
            cd dist
            sha256sum palworld-control-center-linux-amd64 > palworld-control-center-linux-amd64.sha256
          )

      - name: Attach assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/* \
            --clobber
